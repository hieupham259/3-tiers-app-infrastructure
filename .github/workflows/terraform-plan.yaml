name: Terraform Plan

# Required GitHub Actions Repository Variables (Settings -> Secrets and variables -> Actions -> Variables tab):
#   DEV_ACCOUNT_ID  - 12-digit AWS account ID for the development account
#   PROD_ACCOUNT_ID - 12-digit AWS account ID for the production account
# These are stored as Variables (not Secrets) because account IDs are configuration, not credentials.
# All workflows in this directory consume the same two variables; set them once at the repository level.

on:
  pull_request:
    branches: [development, production]
    paths:
      - 'envs/**'
      - 'modules/**'
      - 'scripts/**'
      - '.github/workflows/terraform-plan.yaml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify envs/development and envs/production are in sync
        run: bash scripts/verify-envs-in-sync.sh

  plan:
    needs: sync-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { env: development, account_id: '${{ vars.DEV_ACCOUNT_ID }}' }
          - { env: production, account_id: '${{ vars.PROD_ACCOUNT_ID }}' }
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account_id }}:role/gha-infra-plan
          aws-region: us-east-1

      - name: Terraform fmt -check
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan -input=false
        continue-on-error: true

      - name: Generate plan JSON
        id: plan-json
        if: steps.plan.outcome == 'success'
        run: terraform show -json tfplan > tfplan.json

      - name: Check state preservation
        id: check-state-preservation
        if: steps.plan.outcome == 'success'
        uses: ./.github/actions/check-state-preservation
        with:
          plan-json-path: envs/${{ matrix.env }}/tfplan.json
          commit-message: ${{ github.event.pull_request.title }}
          pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan - \`${{ matrix.env }}\` ${{ steps.plan.outcome == 'success' && 'OK' || 'FAILED' }}\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail step if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
