name: Terraform Plan

# Required GitHub Actions Repository Variables (Settings -> Secrets and variables -> Actions -> Variables tab):
#   DEV_ACCOUNT_ID  - 12-digit AWS account ID for the development account
#   PROD_ACCOUNT_ID - 12-digit AWS account ID for the production account
# These are stored as Variables (not Secrets) because account IDs are configuration, not credentials.
# All workflows in this directory consume the same two variables; set them once at the repository level.

on:
  pull_request:
    branches: [development, production]
    paths:
      - 'envs/**'
      - 'modules/**'
      - 'scripts/**'
      - '.github/workflows/terraform-plan.yaml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify envs/development and envs/production are in sync
        run: bash scripts/verify-envs-in-sync.sh

  plan:
    needs: sync-check
    runs-on: ubuntu-latest
    env:
      ENV_DIR: ${{ github.base_ref == 'production' && 'production' || 'development' }}
      ACCOUNT_ID: ${{ github.base_ref == 'production' && vars.PROD_ACCOUNT_ID || vars.DEV_ACCOUNT_ID }}
      TF_VAR_repository: ${{ github.event.repository.name }}
      # Placeholder for plan-only runs. The RDS master password is sensitive and is rendered as
      # "(sensitive value)" in plan output regardless of the actual value. The real secret is only
      # injected into terraform-apply.yaml via TF_VAR_rds_master_password from a GitHub Environment
      # secret. PR plan runs must never receive the real value because PRs from contributors could
      # be abused to exfiltrate it. This placeholder is never used for apply.
      TF_VAR_rds_master_password: 'plan-placeholder-not-used-for-apply'
    defaults:
      run:
        working-directory: envs/${{ env.ENV_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/gha-infra-plan
          aws-region: us-east-1

      - name: Terraform fmt -check
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan -input=false
        continue-on-error: true

      - name: Generate plan JSON
        id: plan-json
        if: steps.plan.outcome == 'success'
        run: terraform show -json tfplan > tfplan.json

      - name: Check state preservation
        id: check-state-preservation
        if: steps.plan.outcome == 'success'
        uses: ./.github/actions/check-state-preservation
        with:
          plan-json-path: envs/${{ env.ENV_DIR }}/tfplan.json
          commit-message: ${{ github.event.pull_request.title }}
          pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}

      # Render the resource dependency graph. `terraform graph` emits it in Graphviz
      # DOT format; `dot` (preinstalled on ubuntu-latest) renders SVG/PNG. Best-effort:
      # continue-on-error keeps a rendering failure from ever breaking the plan.
      - name: Render Terraform dependency graph
        id: graph
        continue-on-error: true
        run: |
          terraform graph > graph.dot
          dot -Tsvg graph.dot -o graph.svg
          dot -Tpng -Gdpi=150 graph.dot -o graph.png

      - name: Upload dependency graph artifact
        id: upload-graph
        if: steps.graph.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-graph-${{ env.ENV_DIR }}
          path: |
            envs/${{ env.ENV_DIR }}/graph.dot
            envs/${{ env.ENV_DIR }}/graph.svg
            envs/${{ env.ENV_DIR }}/graph.png
          if-no-files-found: warn
          retention-days: 14

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const graphUrl = '${{ steps.upload-graph.outputs.artifact-url }}';
            const graphSection = graphUrl
              ? `\n\n### Resource dependency graph\n[**Open the rendered graph**](${graphUrl}) — download the \`terraform-graph-${{ env.ENV_DIR }}\` artifact, then open \`graph.svg\` in a browser (zoomable).`
              : '';
            const output = `### Terraform Plan - \`${{ env.ENV_DIR }}\` ${{ steps.plan.outcome == 'success' && 'OK' || 'FAILED' }}\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\`\n\n</details>${graphSection}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail step if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
