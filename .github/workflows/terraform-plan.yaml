name: Terraform Plan

# Required GitHub Actions Repository Variables (Settings -> Secrets and variables -> Actions -> Variables tab):
#   DEV_ACCOUNT_ID  - 12-digit AWS account ID for the development account
#   PROD_ACCOUNT_ID - 12-digit AWS account ID for the production account
# These are stored as Variables (not Secrets) because account IDs are configuration, not credentials.
# All workflows in this directory consume the same two variables; set them once at the repository level.

on:
  pull_request:
    branches: [development, production]
    paths:
      - 'envs/**'
      - 'modules/**'
      - 'scripts/**'
      - '.github/workflows/terraform-plan.yaml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify envs/development and envs/production are in sync
        run: bash scripts/verify-envs-in-sync.sh

  plan:
    needs: sync-check
    runs-on: ubuntu-latest
    env:
      ENV_DIR: ${{ github.base_ref == 'production' && 'production' || 'development' }}
      ACCOUNT_ID: ${{ github.base_ref == 'production' && vars.PROD_ACCOUNT_ID || vars.DEV_ACCOUNT_ID }}
      TF_VAR_repository: ${{ github.event.repository.name }}
      # Placeholder for plan-only runs. The RDS master password is sensitive and is rendered as
      # "(sensitive value)" in plan output regardless of the actual value. The real secret is only
      # injected into terraform-apply.yaml via TF_VAR_rds_master_password from a GitHub Environment
      # secret. PR plan runs must never receive the real value because PRs from contributors could
      # be abused to exfiltrate it. This placeholder is never used for apply.
      TF_VAR_rds_master_password: 'plan-placeholder-not-used-for-apply'
    defaults:
      run:
        working-directory: envs/${{ env.ENV_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/gha-infra-plan
          aws-region: us-east-1

      - name: Terraform fmt -check
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan -input=false
        continue-on-error: true

      - name: Generate plan JSON
        id: plan-json
        if: steps.plan.outcome == 'success'
        run: terraform show -json tfplan > tfplan.json

      - name: Check state preservation
        id: check-state-preservation
        if: steps.plan.outcome == 'success'
        uses: ./.github/actions/check-state-preservation
        with:
          plan-json-path: envs/${{ env.ENV_DIR }}/tfplan.json
          commit-message: ${{ github.event.pull_request.title }}
          pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}

      # ---------------------------------------------------------------------------
      # Infrastructure dependency graph (inframap).
      # inframap turns the raw Terraform graph into a readable, provider-aware
      # dependency graph of actual infra resources. These steps are best-effort:
      # continue-on-error keeps a rendering failure from ever breaking the plan.
      # ---------------------------------------------------------------------------
      - name: Install inframap and Graphviz
        id: install-inframap
        continue-on-error: true
        run: |
          # Pin the inframap release; bump this when a newer release is available.
          INFRAMAP_VERSION="v0.7.0"
          curl -fsSL -o /tmp/inframap.tar.gz \
            "https://github.com/cycloidio/inframap/releases/download/${INFRAMAP_VERSION}/inframap-linux-amd64.tar.gz"
          tar -xzf /tmp/inframap.tar.gz -C /tmp
          # The release tarball ships a single binary; install it regardless of its exact name.
          INFRAMAP_BIN="$(find /tmp -maxdepth 1 -type f -name 'inframap*' ! -name '*.tar.gz' | head -n1)"
          sudo install -m 0755 "$INFRAMAP_BIN" /usr/local/bin/inframap
          # Graphviz (`dot`) is preinstalled on ubuntu-latest; install only if missing.
          command -v dot >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y graphviz; }

      - name: Render infrastructure dependency graph
        id: infra-graph
        if: steps.install-inframap.outcome == 'success'
        continue-on-error: true
        run: |
          # Pull the current remote state locally to feed inframap. The state file can
          # contain sensitive values, so it is deleted right after and is NEVER uploaded
          # as an artifact. Only the rendered graph (resource topology only) is kept.
          terraform state pull > tfstate.json
          inframap generate tfstate.json > infra-graph.dot
          dot -Tsvg infra-graph.dot -o infra-graph.svg
          dot -Tpng -Gdpi=150 infra-graph.dot -o infra-graph.png
          rm -f tfstate.json

      - name: Upload dependency graph artifact
        if: steps.infra-graph.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: infra-dependency-graph-${{ env.ENV_DIR }}
          path: |
            envs/${{ env.ENV_DIR }}/infra-graph.dot
            envs/${{ env.ENV_DIR }}/infra-graph.svg
            envs/${{ env.ENV_DIR }}/infra-graph.png
          if-no-files-found: warn
          retention-days: 14

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const graphNote = '${{ steps.infra-graph.outcome }}' === 'success'
              ? '\n\n Infrastructure dependency graph (inframap) is attached to this run as the **infra-dependency-graph-${{ env.ENV_DIR }}** artifact (`.svg` / `.png` / `.dot`).'
              : '';
            const output = `### Terraform Plan - \`${{ env.ENV_DIR }}\` ${{ steps.plan.outcome == 'success' && 'OK' || 'FAILED' }}\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\`\n\n</details>${graphNote}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail step if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
