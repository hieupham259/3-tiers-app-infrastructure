name: CFN Drift Detection

on:
  schedule:
    - cron: '0 18 * * 0'   # Sunday 01:00 ICT
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  drift:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { account: development, account_id: '${{ vars.DEV_ACCOUNT_ID }}' }
          - { account: production, account_id: '${{ vars.PROD_ACCOUNT_ID }}' }
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account_id }}:role/gha-infra-plan
          aws-region: us-east-1

      - name: Detect drift on bootstrap stacks
        run: |
          set -euo pipefail
          for stack in tfstate-backend github-oidc-roles trust-anchor; do
            echo "--- Checking drift on $stack (${{ matrix.account }}) ---"
            DETECTION_ID=$(aws cloudformation detect-stack-drift \
              --stack-name "$stack" \
              --query StackDriftDetectionId --output text)

            # Wait for detection to complete (max ~3 minutes)
            for i in $(seq 1 18); do
              STATUS=$(aws cloudformation describe-stack-drift-detection-status \
                --stack-drift-detection-id "$DETECTION_ID" \
                --query DetectionStatus --output text)
              if [ "$STATUS" = "DETECTION_COMPLETE" ]; then break; fi
              if [ "$STATUS" = "DETECTION_FAILED" ]; then
                echo "::error::Detection FAILED on $stack"; exit 1
              fi
              sleep 10
            done

            DRIFTED=$(aws cloudformation describe-stack-resource-drifts \
              --stack-name "$stack" \
              --query 'StackResourceDrifts[?StackResourceDriftStatus!=`IN_SYNC`]' \
              --output text)
            if [ -n "$DRIFTED" ]; then
              echo "::error::Drift detected on $stack in ${{ matrix.account }}"
              echo "$DRIFTED"
              exit 1
            fi
            echo "OK: $stack is in sync"
          done
