name: Terraform Apply

on:
  push:
    branches: [development, production]
    paths:
      - 'envs/**'
      - 'modules/**'
      - '.github/workflows/terraform-apply.yaml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify envs/development and envs/production are in sync
        run: bash scripts/verify-envs-in-sync.sh

  apply:
    needs: sync-check
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/production' && 'production' || 'development' }}
    env:
      ENV_DIR: ${{ github.ref == 'refs/heads/production' && 'production' || 'development' }}
      ACCOUNT_ID: ${{ github.ref == 'refs/heads/production' && vars.PROD_ACCOUNT_ID || vars.DEV_ACCOUNT_ID }}
      TF_VAR_repository: ${{ github.event.repository.name }}
      TF_VAR_rds_master_password: ${{ secrets.RDS_MASTER_PASSWORD }}
    defaults:
      run:
        working-directory: envs/${{ env.ENV_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/gha-infra-apply
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init -no-color

      - name: Terraform plan
        run: terraform plan -no-color -out=tfplan -input=false

      - name: Generate plan JSON
        id: plan-json
        run: terraform show -json tfplan > tfplan.json

      - name: Check state preservation
        id: check-state-preservation
        uses: ./.github/actions/check-state-preservation
        with:
          plan-json-path: envs/${{ env.ENV_DIR }}/tfplan.json
          commit-message: ${{ github.event.head_commit.message }}
          pr-labels: '[]'

      - name: Terraform apply
        run: terraform apply -no-color -input=false tfplan

      - name: Resolve RDS secret ARN and build desired value
        id: rds_secret
        working-directory: envs/${{ env.ENV_DIR }}
        env:
          TF_VAR_rds_master_password: ${{ secrets.RDS_MASTER_PASSWORD }}
        run: |
          set -euo pipefail
          arn=$(terraform output -raw rds_secret_arn)
          if [ -z "$arn" ]; then
            echo "ERROR: terraform output rds_secret_arn is empty" >&2
            exit 1
          fi
          # Build desired JSON safely with jq (escapes special chars in password).
          desired=$(jq -nc \
            --arg pw "$TF_VAR_rds_master_password" \
            '{username:"app_admin",password:$pw,dbname:"appdb",port:5432}')
          # Mask the value so it never appears in workflow log if accidentally echoed.
          echo "::add-mask::$desired"
          {
            echo "arn=$arn"
            echo 'desired<<SECRET_EOF'
            echo "$desired"
            echo SECRET_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Sync RDS secret value
        uses: ./.github/actions/sync-secret-value
        with:
          secret-arn: ${{ steps.rds_secret.outputs.arn }}
          secret-string: ${{ steps.rds_secret.outputs.desired }}
