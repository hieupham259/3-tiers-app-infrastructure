name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 18 * * *'   # 01:00 ICT every day
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  drift:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { env: development, ref: development, account_id: '${{ vars.DEV_ACCOUNT_ID }}' }
          - { env: production, ref: production, account_id: '${{ vars.PROD_ACCOUNT_ID }}' }
    runs-on: ubuntu-latest
    env:
      TF_VAR_repository: ${{ github.event.repository.name }}
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account_id }}:role/gha-infra-plan
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init -no-color

      - name: Terraform plan (detect drift)
        run: terraform plan -detailed-exitcode -no-color
        # exit code 0 = no diff, 2 = diff (drift). Fail the step if = 2 -> notify.
